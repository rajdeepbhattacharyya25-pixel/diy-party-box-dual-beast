<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512" role="img" aria-label="dualbeast speaker outline logo">
  <!-- Exact 781:1491 Speaker Cabinet Outline (31.43 x 60.00 -> ratio 0.52381 = 781/1491) -->
  <!-- Filled with deep obsidian #070B19 and crisp white outer/inner strokes so it is unmistakable at 16x16 & 32x32 on any browser tab -->
  <rect x="16.28" y="2" width="31.43" height="60" rx="2.6" fill="#070B19" stroke="#FFFFFF" stroke-width="2.6" />
  <!-- Inner Baffle Inset Wall Outline -->
  <rect x="19.0" y="4.7" width="26.0" height="54.6" rx="1.4" fill="none" stroke="#93C5FD" stroke-opacity="0.55" stroke-width="1.1" />

  <!-- 4 Corner Baffle Bosses -->
  <circle cx="21.2" cy="6.9" r="0.9" fill="#93C5FD" fill-opacity="0.85" />
  <circle cx="42.8" cy="6.9" r="0.9" fill="#93C5FD" fill-opacity="0.85" />
  <circle cx="21.2" cy="57.1" r="0.9" fill="#93C5FD" fill-opacity="0.85" />
  <circle cx="42.8" cy="57.1" r="0.9" fill="#93C5FD" fill-opacity="0.85" />

  <!-- Upper Ø 7 cm Dynamic Driver Outline (cy = 16.5, r = 8.6) + 4 Screw Ears + Central Dome & Prongs -->
  <circle cx="25.0" cy="9.5" r="1.05" fill="#FFFFFF" fill-opacity="0.9" />
  <circle cx="39.0" cy="9.5" r="1.05" fill="#FFFFFF" fill-opacity="0.9" />
  <circle cx="25.0" cy="23.5" r="1.05" fill="#FFFFFF" fill-opacity="0.9" />
  <circle cx="39.0" cy="23.5" r="1.05" fill="#FFFFFF" fill-opacity="0.9" />
  <circle cx="32" cy="16.5" r="8.6" fill="none" stroke="#FFFFFF" stroke-width="2.2" />
  <circle cx="32" cy="16.5" r="6.7" fill="none" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="1.0" />
  <circle cx="32" cy="16.5" r="2.9" fill="none" stroke="#FFFFFF" stroke-width="1.7" />
  <line x1="31.0" y1="19.1" x2="30.2" y2="20.9" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" />
  <line x1="33.0" y1="19.1" x2="33.8" y2="20.9" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" />

  <!-- Middle 16-LED WLED Ring Outline (cy = 34.6, rOut = 7.5, rIn = 4.9) -->
  <circle cx="32" cy="34.6" r="6.2" fill="none" stroke="#3B5BFF" stroke-opacity="0.65" stroke-width="3.8" />
  <circle cx="32" cy="34.6" r="7.5" fill="none" stroke="#93C5FD" stroke-width="1.75" />
  <circle cx="32" cy="34.6" r="4.9" fill="none" stroke="#FFFFFF" stroke-width="1.6" />

  <!-- Lower Ø 5 cm Woofer Outline (cy = 50.4, r = 6.4) + 4 Screw Ears + Central Dust Cap -->
  <circle cx="26.7" cy="45.1" r="0.9" fill="#FFFFFF" fill-opacity="0.85" />
  <circle cx="37.3" cy="45.1" r="0.9" fill="#FFFFFF" fill-opacity="0.85" />
  <circle cx="26.7" cy="55.7" r="0.9" fill="#FFFFFF" fill-opacity="0.85" />
  <circle cx="37.3" cy="55.7" r="0.9" fill="#FFFFFF" fill-opacity="0.85" />
  <circle cx="32" cy="50.4" r="6.4" fill="none" stroke="#FFFFFF" stroke-width="2.1" />
  <circle cx="32" cy="50.4" r="4.9" fill="none" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="0.95" />
  <circle cx="32" cy="50.4" r="2.1" fill="none" stroke="#FFFFFF" stroke-width="1.5" />
</svg>
